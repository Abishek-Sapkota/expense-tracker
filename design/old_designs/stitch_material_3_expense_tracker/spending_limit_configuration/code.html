<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#f9f9ff;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-secondary-fixed-variant": "#214f36", "on-primary-container": "#fffbff", "on-tertiary-fixed": "#001e2d", "inverse-on-surface": "#edf0ff", "on-background": "#141b2b", "primary": "#9f3c16", "background": "#f9f9ff", "on-surface": "#141b2b", "error-container": "#ffdad6", "on-error": "#ffffff", "surface-container-low": "#f1f3ff", "primary-container": "#bf542c", "tertiary-fixed": "#c5e7ff", "inverse-primary": "#ffb59c", "inverse-surface": "#293040", "on-primary-fixed": "#390c00", "secondary-fixed": "#bbeecb", "surface-container-high": "#e1e8fd", "secondary": "#39684c", "tertiary-fixed-dim": "#9dcdec", "primary-fixed": "#ffdbcf", "outline": "#8a726a", "tertiary-container": "#4a7a96", "outline-variant": "#dec0b7", "error": "#ba1a1a", "on-surface-variant": "#57423b", "on-tertiary": "#ffffff", "surface-tint": "#a23e18", "on-tertiary-fixed-variant": "#154c66", "secondary-fixed-dim": "#a0d2b0", "surface-variant": "#dce2f7", "on-primary": "#ffffff", "surface-container-highest": "#dce2f7", "on-primary-fixed-variant": "#822801", "tertiary": "#30617c", "primary-fixed-dim": "#ffb59c", "on-secondary-container": "#3c6a4e", "surface-dim": "#d3daef", "on-error-container": "#93000a", "surface-container-lowest": "#ffffff", "surface-bright": "#f9f9ff", "on-tertiary-container": "#fcfcff", "on-secondary-fixed": "#002111", "secondary-container": "#b6e9c6", "surface-container": "#e9edff", "on-secondary": "#ffffff", "surface": "#f9f9ff" }, borderRadius: { DEFAULT: "1rem", lg: "2rem", xl: "3rem", full: "9999px" }, spacing: { "space-sm": "0.5rem", "margin-expanded": "1.5rem", "space-xs": "0.25rem", "space-xl": "2rem", "margin": "1rem", "space-md": "1rem", "space-lg": "1.5rem", "gutter-compact": "0.5rem", "gutter": "1rem" }, fontFamily: { "headline-md": ["Inter"], "headline-sm": ["Inter"], "body-md": ["Inter"], "title-lg": ["Inter"], "display-lg": ["Inter"], "label-lg": ["Inter"], "body-sm": ["Inter"], "label-sm": ["Inter"], "title-sm": ["Inter"], "headline-lg": ["Inter"], "title-md": ["Inter"], "display-md": ["Inter"], "body-lg": ["Inter"], "label-md": ["Inter"] }, fontSize: { "headline-md": ["28px", { lineHeight: "36px", fontWeight: "600" }], "headline-sm": ["24px", { lineHeight: "32px", fontWeight: "600" }], "body-md": ["14px", { lineHeight: "20px", letterSpacing: "0.25px", fontWeight: "400" }], "title-lg": ["22px", { lineHeight: "28px", fontWeight: "500" }], "display-lg": ["57px", { lineHeight: "64px", fontWeight: "400" }], "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.1px", fontWeight: "500" }], "body-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.4px", fontWeight: "400" }], "label-sm": ["11px", { lineHeight: "16px", letterSpacing: "0.5px", fontWeight: "500" }], "title-sm": ["14px", { lineHeight: "20px", letterSpacing: "0.1px", fontWeight: "500" }], "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "600" }], "title-md": ["16px", { lineHeight: "24px", letterSpacing: "0.15px", fontWeight: "600" }], "display-md": ["45px", { lineHeight: "52px", fontWeight: "400" }], "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "0.5px", fontWeight: "400" }], "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.5px", fontWeight: "500" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col antialiased"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Navigate back" class="w-12 h-12 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-title-lg text-title-lg text-on-surface truncate">Spending Limit</h1></div><div class="flex items-center gap-space-xs"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col w-full bg-surface pt-14 pb-safe"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Active Limit Status Card -->
<div class="mt-space-md w-full bg-surface-container-low rounded-lg p-space-lg flex flex-col shadow-sm">
<div class="flex items-center justify-between">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider font-semibold">Today's Spend</span>
<span class="inline-flex items-center gap-1 font-label-sm text-label-sm text-secondary bg-secondary-container/60 px-space-sm py-0.5 rounded-full">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
        Active
      </span>
</div>
<div class="mt-space-sm flex items-baseline gap-space-xs">
<span class="font-headline-lg text-headline-lg text-on-surface tracking-tight">रु 1,240.00</span>
<span class="font-body-md text-body-md text-on-surface-variant">/ रु 2,000.00</span>
</div>
<!-- Progress Indicator -->
<div class="mt-space-md w-full bg-surface-container-highest rounded-full h-2 overflow-hidden flex">
<div class="bg-primary h-full rounded-full transition-all duration-500 ease-out" id="limit-progress-bar" style="width: 62%;"></div>
</div>
<!-- Metrics Line -->
<div class="mt-space-sm flex items-center justify-between text-on-surface-variant">
<span class="font-body-sm text-body-sm">
        Remaining: <strong class="font-title-sm text-title-sm text-on-surface">रु 760.00</strong>
</span>
<span class="font-label-sm text-label-sm flex items-center gap-0.5">
<span class="material-symbols-outlined text-[14px]">schedule</span>
        Resets in 9h 45m
      </span>
</div>
</div>
<!-- Set Limit Form -->
<div class="mt-space-xl flex flex-col">
<h2 class="font-title-md text-title-md text-on-surface">Set a limit</h2>
<!-- Recurrence Choice Chips -->
<div aria-label="Limit period" class="mt-space-md flex items-center gap-space-sm" role="radiogroup">
<button aria-checked="true" class="h-9 px-space-md rounded-full bg-primary text-on-primary font-label-lg text-label-lg flex items-center gap-space-xs transition-colors" id="btn-chip-daily" onclick="selectPeriod('daily')" role="radio" type="button">
<span class="material-symbols-outlined text-[18px]">check</span>
        Daily
      </button>
<button aria-checked="false" class="h-9 px-space-md rounded-full bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center gap-space-xs hover:bg-surface-container-high transition-colors" id="btn-chip-monthly" onclick="selectPeriod('monthly')" role="radio" type="button">
        Monthly
      </button>
</div>
<!-- Editable Amount Display Field -->
<div class="mt-space-lg flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-space-xs" for="limit-amount-input">
        Threshold amount
      </label>
<div class="w-full bg-surface-container-lowest rounded-DEFAULT p-space-md flex items-center gap-space-xs shadow-sm focus-within:bg-surface-container-low transition-colors">
<span class="font-headline-md text-headline-md text-primary font-semibold select-none">रु</span>
<input aria-label="Spending limit value in Nepali Rupees" class="w-full bg-transparent font-headline-md text-headline-md text-on-surface font-semibold tracking-tight outline-none" id="limit-amount-input" inputmode="decimal" placeholder="0.00" type="text" value="2,000.00"/>
<button aria-label="Edit amount" class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-on-surface rounded-full transition-colors" onclick="document.getElementById('limit-amount-input').focus()" type="button">
<span class="material-symbols-outlined text-[20px]">edit</span>
</button>
</div>
<p class="mt-space-sm font-body-sm text-body-sm text-on-surface-variant flex items-center gap-1" id="reset-cadence-label">
<span class="material-symbols-outlined text-[16px]">sync</span>
        Resets every day at midnight
      </p>
</div>
<!-- Quick Presets -->
<div class="mt-space-md flex items-center gap-space-xs overflow-x-auto py-1">
<button class="px-space-md py-1 rounded-full bg-surface-container text-on-surface font-label-md text-label-md hover:bg-surface-container-high active:scale-95 transition-all shrink-0" onclick="setPreset('1,000.00')" type="button">
        रु 1,000
      </button>
<button class="px-space-md py-1 rounded-full bg-surface-container text-on-surface font-label-md text-label-md hover:bg-surface-container-high active:scale-95 transition-all shrink-0" onclick="setPreset('2,000.00')" type="button">
        रु 2,000
      </button>
<button class="px-space-md py-1 rounded-full bg-surface-container text-on-surface font-label-md text-label-md hover:bg-surface-container-high active:scale-95 transition-all shrink-0" onclick="setPreset('3,500.00')" type="button">
        रु 3,500
      </button>
<button class="px-space-md py-1 rounded-full bg-surface-container text-on-surface font-label-md text-label-md hover:bg-surface-container-high active:scale-95 transition-all shrink-0" onclick="setPreset('5,000.00')" type="button">
        रु 5,000
      </button>
</div>
</div>
<!-- Primary and Secondary Actions -->
<div class="mt-space-xl flex flex-col gap-space-sm">
<button class="w-full h-14 rounded-full bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-sm active:scale-[0.98] transition-transform" id="save-limit-btn" onclick="handleSave()" type="button">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
      Save Limit
    </button>
<button class="w-full h-12 rounded-full bg-transparent text-error font-label-lg text-label-lg flex items-center justify-center gap-space-xs hover:bg-error-container/40 active:scale-[0.98] transition-colors" onclick="handleDeactivate()" type="button">
<span class="material-symbols-outlined text-[18px]">block</span>
      Turn off limit
    </button>
</div>
<!-- Visual Delight / Tactile Notification Toast (Hidden by default) -->
<div class="fixed bottom-12 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-space-lg py-space-sm rounded-full shadow-lg flex items-center gap-space-xs opacity-0 pointer-events-none transition-opacity duration-300 z-50" id="feedback-toast">
<span class="material-symbols-outlined text-[18px] text-secondary-fixed">done</span>
<span class="font-label-md text-label-md font-medium" id="toast-message">Changes saved locally</span>
</div>
</div>
<script>
  let selectedPeriodType = 'daily';

  function selectPeriod(type) {
    selectedPeriodType = type;
    const dailyBtn = document.getElementById('btn-chip-daily');
    const monthlyBtn = document.getElementById('btn-chip-monthly');
    const cadenceLabel = document.getElementById('reset-cadence-label');

    if (type === 'daily') {
      dailyBtn.className = 'h-9 px-space-md rounded-full bg-primary text-on-primary font-label-lg text-label-lg flex items-center gap-space-xs transition-colors';
      dailyBtn.setAttribute('aria-checked', 'true');
      dailyBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span>Daily';

      monthlyBtn.className = 'h-9 px-space-md rounded-full bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center gap-space-xs hover:bg-surface-container-high transition-colors';
      monthlyBtn.setAttribute('aria-checked', 'false');
      monthlyBtn.innerHTML = 'Monthly';

      cadenceLabel.innerHTML = '<span class="material-symbols-outlined text-[16px]">sync</span>Resets every day at midnight';
    } else {
      monthlyBtn.className = 'h-9 px-space-md rounded-full bg-primary text-on-primary font-label-lg text-label-lg flex items-center gap-space-xs transition-colors';
      monthlyBtn.setAttribute('aria-checked', 'true');
      monthlyBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span>Monthly';

      dailyBtn.className = 'h-9 px-space-md rounded-full bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center gap-space-xs hover:bg-surface-container-high transition-colors';
      dailyBtn.setAttribute('aria-checked', 'false');
      dailyBtn.innerHTML = 'Daily';

      cadenceLabel.innerHTML = '<span class="material-symbols-outlined text-[16px]">sync</span>Resets on 1st of every month';
    }
  }

  function setPreset(val) {
    const input = document.getElementById('limit-amount-input');
    input.value = val;
    input.focus();
  }

  function showToast(msg) {
    const toast = document.getElementById('feedback-toast');
    const msgEl = document.getElementById('toast-message');
    msgEl.textContent = msg;
    toast.classList.remove('opacity-0', 'pointer-events-none');
    toast.classList.add('opacity-100');

    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0', 'pointer-events-none');
    }, 2200);
  }

  function handleSave() {
    const val = document.getElementById('limit-amount-input').value;
    showToast('Spending limit updated to रु ' + val);
  }

  function handleDeactivate() {
    showToast('Spending limit disabled');
  }
</script><footer class="w-full py-space-md px-margin flex items-center justify-center gap-space-xs mt-auto select-none"><span class="material-symbols-outlined text-[16px] text-secondary">lock</span><span class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">100% Offline · Local Encrypted Device Storage</span></footer></main></body></html>
